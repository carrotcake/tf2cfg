name: Release

# Tag-only: v* pushes build, package and attach the AppImage. Paths filters are
# unreliable on tag pushes (no diff base), so this workflow has no docs gate and
# lives apart from ci.yml (see ci.yml header).
on:
  push:
    tags: ["v*"]

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Needed by the release step (softprops/action-gh-release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Qt 6.12: the same toolchain the dev box, the tests, qmllint and the Windows
      # job use. Do NOT reach for the runner's apt Qt (6.4.2 on ubuntu-24.04): the
      # first AppImage shipped "[object Object]" combo entries from exactly that
      # skew - Tf2ComboBox's popup delegate resolves text via model[textRole]
      # (Tf2ComboBox.qml), a lookup the 6.4-era engine does not perform for C++
      # QVariantList-of-QVariantMap models, so every entry fell through to
      # String(modelData) and printed the map object.
      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          # Qt 6.11+ splits the desktop package folders per architecture; the latest
          # released aqtinstall (3.3.0, this action's default backend) still asks for
          # the pre-split layout and 6.12 dies with "Failed to locate XML data". Pin
          # the same upstream commit fix the Windows job explains in full
          # (miurahr/aqtinstall#1000 via jurplel/install-qt-action#374); the package
          # layout change is platform-independent, so linux needs this pin too.
          # Revisit when aqtinstall cuts a release with the fix.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c7'
          # The official Qt binaries bundle no system dependencies (apt's Qt pulled
          # libGL, fontconfig, xkbcommon etc. as package deps). The smoke test
          # actually runs the QML engine headless, so install the runtime deps.
          install-deps: true

      - name: Verify the Qt toolchain is really 6.12
        run: |
          # Parity with the windows job's gcc guard: make version drift loud here,
          # because "Install Qt" is exactly the step a runner migration silently
          # reverts to `sudo apt-get install qt6-base-dev`.
          case "$(qmake -query QT_VERSION)" in
            6.12.*) ;;
            *) echo "::error::expected Qt 6.12, got $(qmake -query QT_VERSION)"; exit 1 ;;
          esac

      - name: Build app (qmake + make)
        run: |
          qmake -o Makefile tf2cfgreal.pro
          make -j"$(nproc)"

      # -- AppImage packaging ------------------------------------------------
      # Builds on the pinned Qt 6.12 above / the runner's glibc; the result targets
      # current distros by design (docs/ROADMAP.md). Attached to the GitHub Release
      # and uploaded as an artifact of this run.
      - name: Install AppImage tooling
        run: |
          sudo apt-get install -y imagemagick
          # linuxdeploy's qt plugin locates the toolchain via `qmake -query`: the
          # install-qt-action Qt above is on PATH as `qmake`, so it deploys that
          # 6.12 bundle (not any runner Qt).
          curl -sL -o linuxdeploy.AppImage \
              https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          # The qt plugin is discovered by filename next to linuxdeploy.
          curl -sL -o linuxdeploy-plugin-qt-x86_64.AppImage \
              https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Render app icon (ImageMagick, from the repo's TF2 font)
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          # IM 6 on ubuntu-latest: the binary is `convert` (IM 7 renamed it `magick`).
          convert -size 256x256 xc:none \
                 -fill "#141719" -draw "roundrectangle 0,0 255,255 40,40" \
                 -fill "#f0a30a" -font res/font/tf2build.ttf -pointsize 80 \
                 -gravity center -annotate +0-10 ".cfg" \
                 AppDir/usr/share/icons/hicolor/256x256/apps/tf2cfg.png

      - name: Bundle AppImage
        run: |
          install -D -m 755 tf2cfgreal AppDir/usr/bin/tf2cfgreal
          install -D -m 644 res/icon/tf2cfg.desktop AppDir/tf2cfg.desktop
          export DISABLE_COPYRIGHT_FILE_DEPLOYMENT=1
          # QML import scanning (this is what decides whether the QuickControls2
          # style plugins get bundled - without them the app cannot start, since
          # QQuickStyle "Basic" is set in main.cpp). All app QML is qrc-embedded;
          # the scan of the qml/ tree covers the imports (QtQuick, QuickControls2).
          # As a linuxdeploy plugin, linuxdeploy-plugin-qt is configured via env.
          export QML_SOURCES_PATHS="$PWD/qml"
          # The offscreen platform plugin is needed for the headless CI smoke test;
          # desktop users get xcb, which is deployed by default.
          export EXTRA_PLATFORM_PLUGINS=libqoffscreen.so
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage \
              --desktop-file res/icon/tf2cfg.desktop
          mv TF2_Config_Manager-*.AppImage "TF2-Config-Manager-x86_64.AppImage"
          ls -l TF2-Config-Manager-x86_64.AppImage

      - name: Smoke-test the AppImage (headless run)
        run: |
          # Proves extraction, Qt plugin initialization and QML engine load in one
          # shot: the app runs its event loop headless (offscreen platform) until
          # timeout kills it (exit 124). Any other nonzero exit is a real failure -
          # e.g. a missing bundled plugin fails before the app shows anything.
          #
          # Test the BUNDLE, not the host Qt: install-qt-action exports
          # QT_PLUGIN_PATH / QML2_IMPORT_PATH (see the windows job's smoke test),
          # and a leaked env lets a bundle missing a plugin or lib start anyway.
          # Also note: headless = startup proof only. No popup or dialog ever opens
          # here, so rendering regressions ([object Object] shipped in v0.x combo
          # entries via that gap) must be verified by hand against the artifact.
          set +e
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH QT_QPA_PLATFORM=offscreen timeout 15s \
              ./TF2-Config-Manager-x86_64.AppImage --appimage-extract-and-run > smoke.log 2>&1
          rc=$?
          set -e
          if [ "$rc" != 124 ] && [ "$rc" != 0 ]; then
            cat smoke.log
            echo "::error::AppImage smoke test failed (exit $rc)"
            exit 1
          fi
          echo "AppImage extracts and runs headless (exit $rc)"

      - uses: actions/upload-artifact@v4
        with:
          name: TF2-Config-Manager-AppImage
          path: TF2-Config-Manager-x86_64.AppImage

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: TF2-Config-Manager-x86_64.AppImage

  # -- Windows build (MinGW, same toolchain as the dev box) ----------------------
  # Runs only on v* tags, parallel to the AppImage job; attaches a windeployqt
  # zip (runnable on a clean machine) to the same Release. The exe's icon is
  # rendered at build time from the same font + draw script the AppImage uses,
  # then baked into the binary through a Windows resource file (qmake RC_FILE,
  # compiled by windres).
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          arch: win64_mingw
          version: '6.12.*'
          # The MinGW toolchain matching Qt's prebuilt libraries (GCC 13.1.0,
          # <Qt root>/Tools/mingw1310_64). The action prepends Tools/**/bin to
          # PATH, so the build links with this runtime, not the runner's
          # preinstalled gcc 15.2 - that link dies on libQt6EntryPoint.a
          # (__imp___argc undefined, Qt's libs are built against this runtime).
          tools: 'tools_mingw1310'
          # Qt split the Windows desktop package folders per architecture from 6.11
          # on (qt6_6120/qt6_6120_mingw_64/Updates.xml, not qt6_6120/qt6_6120/); the
          # released aqtinstall 3.3.0 - this action's default backend - still asks
          # for the old path, so 6.12 dies with "Failed to locate XML data". Pin the
          # upstream commit that learned the new layout (miurahr/aqtinstall#1000 via
          # jurplel/install-qt-action#374). Full commit, not a branch, for
          # reproducibility. Revisit when aqtinstall cuts a release with the fix;
          # fallback: version '6.10.*' without aqtsource.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Render the app icon (ImageMagick, from the repo's TF2 font)
        shell: bash
        run: |
          # Same draw script as the AppImage job. One 256x256 render, then one
          # auto-resize convert packs every size (256/64/48/32/16) into the .ico -
          # no per-size calls. The intermediate PNG is not kept; the committed
          # res/icon/tf2cfg.svg is the mockup, the .ico is never checked in.
          magick -size 256x256 xc:none \
                 -fill "#141719" -draw "roundrectangle 0,0 255,255 40,40" \
                 -fill "#f0a30a" -font res/font/tf2build.ttf -pointsize 80 \
                 -gravity center -annotate +0-10 ".cfg" \
                 res/icon/tf2cfg_win.png
          magick res/icon/tf2cfg_win.png -define icon:auto-resize=256,64,48,32,16 \
                 res/icon/tf2cfg.ico
          rm res/icon/tf2cfg_win.png

      - name: Build app (qmake + mingw32-make)
        shell: bash
        run: |
          # The action put Qt's bundled MinGW (Tools/mingw1310_64/bin) on PATH;
          # verify the compiler is that GCC 13, not the runner's gcc 15.2 - the
          # wrong runtime fails at link with __imp___argc undefined
          # (libQt6EntryPoint.a), so fail here with the version visible.
          echo "gcc at: $(command -v gcc)"
          gcc --version | head -1
          case "$(gcc --version | head -1)" in
            *" 13."*) ;;
            *) echo "::error::wrong gcc - Qt's bundled MinGW is not on PATH"; exit 1 ;;
          esac
          qmake -o Makefile tf2cfgreal.pro
          mingw32-make -j8

      - name: Stage the deployment in a clean dir (windeployqt)
        shell: cmd
        run: |
          mkdir tf2cfg
          copy release\tf2cfgreal.exe tf2cfg\
          rem --include-plugins qoffscreen: windeployqt ships only platforms\qwindows.dll,
          rem and the smoke test runs with QT_QPA_PLATFORM=offscreen. Without it in the
          rem bundle the test borrowed the install's copy via QT_PLUGIN_PATH and passed.
          windeployqt --qmldir qml --include-plugins qoffscreen tf2cfg\tf2cfgreal.exe

      - name: Smoke-test the staged exe (headless run)
        shell: pwsh
        run: |
          # AppImage smoke-test parity: the app runs its event loop headless
          # (offscreen platform) until killed - a still-running process after 15 s
          # is success (exit 124 semantics). Any earlier exit is a broken
          # deployment (e.g. a missing bundled plugin fails before the first frame).
          #
          # Test the BUNDLE, not the runner's Qt install: install-qt-action exports
          # QT_PLUGIN_PATH / QML2_IMPORT_PATH into the install and puts its bin on
          # PATH, so a bundle missing a plugin or a DLL still starts.
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = "C:\Windows\System32"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $p = Start-Process -FilePath "tf2cfg\tf2cfgreal.exe" -WorkingDirectory (Get-Location) `
               -PassThru -NoNewWindow -RedirectStandardError smoke-err.txt
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            "::error::staged exe exited early (code $($p.ExitCode))"
            Get-Content smoke-err.txt
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          # A Qt fatal (e.g. no platform plugin) shows a blocking dialog: the process
          # stays alive while it is up, so "still alive" alone is not proof the event
          # loop was reached.
          if (Select-String -Path smoke-err.txt -Pattern 'no Qt platform plugin could be initialized' -Quiet) {
            "::error::Qt failed to initialise a platform plugin - the bundle is incomplete"
            Get-Content smoke-err.txt
            exit 1
          }
          "staged exe runs headless from its own directory"

      - name: Archive the deployment
        shell: pwsh
        run: |
          # Zip the staged dir itself: extraction makes one tf2cfg/ folder, and
          # nothing from the build tree (objects, moc .cpp, logs) can leak in.
          # -Path <dir> keeps the folder as the archive root.
          Compress-Archive -Path tf2cfg -DestinationPath TF2-Config-Manager-windows-x64.zip -Force
          # Guard: the first zip shipped without the exe. The step that chose
          # entries was wrong - PowerShell -or and -and have equal precedence, so
          # "name is exe|dll -or is a dir -and name is in the list" kept only the
          # named dirs, dropping every top-level file. Assert the archive carries
          # the app and its Qt runtime instead of trusting any selection.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path TF2-Config-Manager-windows-x64.zip).Path)
          $entries = $zip.Entries.FullName
          $count = $zip.Entries.Count
          $zip.Dispose()
          $missing = @('tf2cfg/tf2cfgreal.exe', 'tf2cfg/Qt6Core.dll', 'tf2cfg/Qt6Qml.dll') |
            Where-Object { $entries -notcontains $_ }
          if ($missing) { "::error::archive is missing: $($missing -join ', ')"; exit 1 }
          Get-Item TF2-Config-Manager-windows-x64.zip | Select-Object Name, Length
          "entries: $count"

      - uses: actions/upload-artifact@v4
        with:
          name: TF2-Config-Manager-windows-x64
          path: TF2-Config-Manager-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: TF2-Config-Manager-windows-x64.zip