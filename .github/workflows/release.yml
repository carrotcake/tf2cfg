name: Release

# Tag-only: v* pushes build, package and attach the AppImage. Paths filters are
# unreliable on tag pushes (no diff base), so this workflow has no docs gate and
# lives apart from ci.yml (see ci.yml header).
on:
  push:
    tags: ["v*"]

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Needed by the release step (softprops/action-gh-release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev libgl1-mesa-dev \
                                  qmake6 qt6-tools-dev-tools \
                                  qml6-module-qtquick qml6-module-qtquick-controls \
                                  qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
                                  qml6-module-qtquick-templates qml6-module-qtquick-window \
                                  qml6-module-qtqml-workerscript

      - name: Build app (qmake + make)
        run: |
          qmake6 -o Makefile tf2cfgreal.pro
          make -j"$(nproc)"

      # -- AppImage packaging ------------------------------------------------
      # Builds on ubuntu-latest's Qt 6.4.2 / glibc 2.39; the result targets current
      # distros by design (docs/ROADMAP.md). Attached to the GitHub Release and
      # uploaded as an artifact of this run.
      - name: Install AppImage tooling
        run: |
          sudo apt-get install -y imagemagick
          # linuxdeployqt invokes `qmake`; apt installs it as `qmake6`.
          sudo ln -s "$(command -v qmake6)" /usr/local/bin/qmake
          curl -sL -o linuxdeploy.AppImage \
              https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          # The qt plugin is discovered by filename next to linuxdeploy.
          curl -sL -o linuxdeploy-plugin-qt-x86_64.AppImage \
              https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Render app icon (ImageMagick, from the repo's TF2 font)
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          # IM 6 on ubuntu-latest: the binary is `convert` (IM 7 renamed it `magick`).
          convert -size 256x256 xc:none \
                 -fill "#141719" -draw "roundrectangle 0,0 255,255 40,40" \
                 -fill "#f0a30a" -font res/font/tf2build.ttf -pointsize 80 \
                 -gravity center -annotate +0-10 ".cfg" \
                 AppDir/usr/share/icons/hicolor/256x256/apps/tf2cfg.png

      - name: Bundle AppImage
        run: |
          install -D -m 755 tf2cfgreal AppDir/usr/bin/tf2cfgreal
          install -D -m 644 res/icon/tf2cfg.desktop AppDir/tf2cfg.desktop
          export DISABLE_COPYRIGHT_FILE_DEPLOYMENT=1
          # QML import scanning (this is what decides whether the QuickControls2
          # style plugins get bundled - without them the app cannot start, since
          # QQuickStyle "Basic" is set in main.cpp). All app QML is qrc-embedded;
          # the scan of the qml/ tree covers the imports (QtQuick, QuickControls2).
          # As a linuxdeploy plugin, linuxdeploy-plugin-qt is configured via env.
          export QML_SOURCES_PATHS="$PWD/qml"
          # The offscreen platform plugin is needed for the headless CI smoke test;
          # desktop users get xcb, which is deployed by default.
          export EXTRA_PLATFORM_PLUGINS=libqoffscreen.so
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage \
              --desktop-file res/icon/tf2cfg.desktop
          mv TF2_Config_Manager-*.AppImage "TF2-Config-Manager-x86_64.AppImage"
          ls -l TF2-Config-Manager-x86_64.AppImage

      - name: Smoke-test the AppImage (headless run)
        run: |
          # Proves extraction, Qt plugin initialization and QML engine load in one
          # shot: the app runs its event loop headless (offscreen platform) until
          # timeout kills it (exit 124). Any other nonzero exit is a real failure -
          # e.g. a missing bundled plugin fails before the app shows anything.
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15s \
              ./TF2-Config-Manager-x86_64.AppImage --appimage-extract-and-run > smoke.log 2>&1
          rc=$?
          set -e
          if [ "$rc" != 124 ] && [ "$rc" != 0 ]; then
            cat smoke.log
            echo "::error::AppImage smoke test failed (exit $rc)"
            exit 1
          fi
          echo "AppImage extracts and runs headless (exit $rc)"

      - uses: actions/upload-artifact@v4
        with:
          name: TF2-Config-Manager-AppImage
          path: TF2-Config-Manager-x86_64.AppImage

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: TF2-Config-Manager-x86_64.AppImage

  # -- Windows build (MinGW, same toolchain as the dev box) ----------------------
  # Runs only on v* tags, parallel to the AppImage job; attaches a windeployqt
  # zip (runnable on a clean machine) to the same Release. The exe's icon is
  # rendered at build time from the same font + draw script the AppImage uses,
  # then baked into the binary through a Windows resource file (qmake RC_FILE,
  # compiled by windres).
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          arch: win64_mingw
          version: '6.12.*'
          # Qt split the Windows desktop package folders per architecture from 6.11
          # on (qt6_6120/qt6_6120_mingw_64/Updates.xml, not qt6_6120/qt6_6120/); the
          # released aqtinstall 3.3.0 - this action's default backend - still asks
          # for the old path, so 6.12 dies with "Failed to locate XML data". Pin the
          # upstream commit that learned the new layout (miurahr/aqtinstall#1000 via
          # jurplel/install-qt-action#374). Full commit, not a branch, for
          # reproducibility. Revisit when aqtinstall cuts a release with the fix;
          # fallback: version '6.10.*' without aqtsource.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Render the app icon (ImageMagick, from the repo's TF2 font)
        shell: bash
        run: |
          # Same draw script as the AppImage job. One 256x256 render, then one
          # auto-resize convert packs every size (256/64/48/32/16) into the .ico -
          # no per-size calls. The intermediate PNG is not kept; the committed
          # res/icon/tf2cfg.svg is the mockup, the .ico is never checked in.
          magick -size 256x256 xc:none \
                 -fill "#141719" -draw "roundrectangle 0,0 255,255 40,40" \
                 -fill "#f0a30a" -font res/font/tf2build.ttf -pointsize 80 \
                 -gravity center -annotate +0-10 ".cfg" \
                 res/icon/tf2cfg_win.png
          magick res/icon/tf2cfg_win.png -define icon:auto-resize=256,64,48,32,16 \
                 res/icon/tf2cfg.ico
          rm res/icon/tf2cfg_win.png

      - name: PROBE where aqt put MinGW (remove after diagnosis)
        shell: bash
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          ls "$QT_ROOT_DIR" 2>/dev/null | head -20
          ls "$QT_ROOT_DIR/.." 2>/dev/null | head -20
          ls "$QT_ROOT_DIR/../Tools" 2>/dev/null | head -20
          ls "$QT_ROOT_DIR/../../Tools" 2>/dev/null | head -20
          ls "C:/mingw64/bin/gcc.exe" "D:/a/tf2cfg/Qt" 2>/dev/null
          find "D:/a/tf2cfg/Qt" -maxdepth 3 -name "gcc.exe" 2>/dev/null | head -5
          true

      - name: Build app (qmake + mingw32-make)
        shell: bash
        run: |
          # Compile AND link with Qt's own bundled MinGW (aqt installs it under
          # <Qt root>/Tools/mingw*/bin, a SIBLING of the version dir), not the
          # runner's preinstalled gcc: Qt's prebuilt libs are built against that
          # runtime, and a newer system gcc fails at link with __imp___argc
          # undefined (libQt6EntryPoint.a). Hard-check the glob so a miss fails
          # here instead of silently building with the wrong gcc.
          shopt -s nullglob
          # QT_ROOT_DIR is what install-qt-action exports (QT_INSTALL_DIR is
          # "**Unknown**" in Qt 6.12's qmake -query). aqt puts the toolchain under
          # the Qt ROOT's Tools/ (dev box: C:\Qt\Tools\mingw1310_64) - two levels
          # up from QT_ROOT_DIR (which points at <root>/6.12.0/mingw_64).
          MINGW_BIN=( "$QT_ROOT_DIR/../../Tools"/mingw*/bin )
          shopt -u nullglob
          if [ ${#MINGW_BIN[@]} -eq 0 ]; then
            echo "::error::Qt's bundled MinGW not found under Tools/" >&2
            exit 1
          fi
          echo "using MinGW: ${MINGW_BIN[0]}"
          export PATH="${MINGW_BIN[0]}:$PATH"
          qmake -o Makefile tf2cfgreal.pro
          mingw32-make -j8

      - name: Deploy the runtime beside the exe (windeployqt)
        shell: cmd
        run: windeployqt --qmldir qml release\tf2cfgreal.exe

      - name: Smoke-test the deployed exe (headless run)
        shell: pwsh
        run: |
          # AppImage smoke-test parity: the app runs its event loop headless
          # (offscreen platform) until killed - a still-running process after 15 s
          # is success (exit 124 semantics). Any earlier exit is a broken
          # deployment (e.g. a missing bundled plugin fails before the first frame).
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "release\tf2cfgreal.exe" -WorkingDirectory (Get-Location) -PassThru -NoNewWindow
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            "::error::deployed exe exited early (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          "deployed exe runs headless"

      - name: Archive the deployed build
        shell: pwsh
        run: |
          # Everything the deployed folder needs: exe + DLLs + windeployqt's plugin
          # dirs. The offscreen platform plugin is part of platforms/, so the
          # smoke-test configuration is what ships.
          $items = Get-ChildItem release | Where-Object {
            $_.Name -match '\.(exe|dll)$' -or
            $_.PSIsContainer -and $_.Name -in @('platforms','styles','imageformats','iconengines','qml')
          }
          Compress-Archive -Path $items.FullName -DestinationPath TF2-Config-Manager-windows-x64.zip -Force
          Get-Item TF2-Config-Manager-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TF2-Config-Manager-windows-x64
          path: TF2-Config-Manager-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: TF2-Config-Manager-windows-x64.zip