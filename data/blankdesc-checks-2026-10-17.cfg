// tf2cfg catalog check - the 23 rows with an empty description, 2026-10-17
// They register on this client but both 10-26 dumps print no help text for them,
// and none of the names exist in the CS2 dump - so a description can only be
// earned from what the client DOES. The log decides which of the 23 merit text
// and which stay blank (docs/ROADMAP.md section 7d).
//
// Run on a listen server you host (Create Server), not by joining one: the sv_*
// rows are server-side and only accept sets from you as the host, and three
// probes are cheat-tagged (fog_radial, fog_radialskybox, sv_viewmodel_lag_do_angles).
// Log first, stop after:
//   con_logfile blankdesc-checks.txt
//   ... exec blankdesc-checks-2026-10-17 ... play ... exec blankdesc-checks-restore
//   con_logfile ""
// Copy the log into data/. Console spew lands in the log; visual/audio effects
// you watch yourself and report.

// PART 1 - help pass. The client prints whatever embedded text it carries (the
// same column cvarlist prints, expected blank). Anything printed is a discovery.
help cl_movehelper_process
help cl_movehelper_process_imp
help cl_movehelper_process_vel
help cl_pred_doresetlatch
help fog_radial
help fog_radialskybox
help sdl_double_click_size
help sdl_double_click_time
help snd_ducking_off
help sv_allow_server_adverisement_to_master_server
help sv_use_steam_networking
help sv_viewmodel_lag_do_angles
help sv_wallbug
help tf_hide_custom_decals
help tf_voice_command_suspension_rate_limit_bucket_count
help tf_voice_command_suspension_rate_limit_bucket_refill_rate
help vgui_font_reload
help vgui_ui_scale_factor
help vgui_ui_scale_factor_deck_additional
help vgui_ui_scale_height
help vgui_ui_scale_width
help vmodule_resetparents
help vphysics_nan_debug
help vprof_vtrace
help mat_texture_list_txlod_sync

// PART 2 - readback pass, cvars only (a bare command name would execute it).
// These echo your current values: the restore block in PART 6 wants exact
// starting values where they differ from the catalog defaults noted there.
cl_movehelper_process
cl_movehelper_process_imp
cl_movehelper_process_vel
cl_pred_doresetlatch
fog_radial
fog_radialskybox
sdl_double_click_size
sdl_double_click_time
snd_ducking_off
sv_allow_server_adverisement_to_master_server
sv_use_steam_networking
sv_viewmodel_lag_do_angles
sv_wallbug
tf_hide_custom_decals
tf_voice_command_suspension_rate_limit_bucket_count
tf_voice_command_suspension_rate_limit_bucket_refill_rate
vgui_ui_scale_factor
vgui_ui_scale_factor_deck_additional
vgui_ui_scale_height
vgui_ui_scale_width
vphysics_nan_debug

// PART 3 - cheats unlocked. Only on your own server; on others sv_cheats is the
// host's lever and the set will be refused with sv_cheats 0.
sv_cheats 1

// PART 4 - leave-on probes. Everything here turns something on or off and STAYS
// that way until you run PART 6 by hand. Play through the changes right after
// the exec finishes; console spew is captured in the log, looks are on you.
//
// Viewer code cvars (defaults all 1): watch the console and player motion with
// each off - movehelper processing, its impact and velocity variants, and the
// prediction latch reset are all candidates for spew or visible prediction
// glitches.
cl_movehelper_process 0
cl_movehelper_process_imp 0
cl_movehelper_process_vel 0
cl_pred_doresetlatch 0
//
// Viewmodel lag angles (cheat + game): strafe left/right hard and watch the
// viewmodel swing vs before.
sv_viewmodel_lag_do_angles 0
//
// Server-side movement: wall bug handling (default 0). Walk into walls and over
// corners and watch for changed collision behavior.
sv_wallbug 1
//
// Server advertising (default 0): turn on with the server starting up and watch
// the server-side console for an advertising/master-server message.
sv_allow_server_adverisement_to_master_server 1
//
// Voice command suspension buckets (defaults 5 / 6): a tiny bucket with a slow
// refill should trip the suspension of your voice menu after a burst - spam
// voicemenu entries and watch for a suspension notice.
tf_voice_command_suspension_rate_limit_bucket_count 1
tf_voice_command_suspension_rate_limit_bucket_refill_rate 1
//
// Custom decal hiding (default 1): with it 0, custom decals show if the map
// carries any; look around a community map if the stock ones show none.
tf_hide_custom_decals 0
//
// VGUI probes: factor doubling should visibly scale the whole menu UI; the
// width/height pairs are the reference size it scales from. Deck additional is
// a Steam Deck multiplier - console reaction here is the only expectation.
vgui_font_reload
vgui_ui_scale_factor 2
vgui_ui_scale_factor_deck_additional 2
vgui_ui_scale_height 1440
vgui_ui_scale_width 2560
//
// Both VGUI commands run bare: font reload spews, module parent reset prints.
vmodule_resetparents
//
// Physics NaN handling (Linux row): watch console for safeguard logs.
vphysics_nan_debug 1
//
// SDL double-click feel (Linux rows; defaults 2 / 400): after the exec, move the
// mouse in the menus and feel speed and the click radius change.
sdl_double_click_size 4
sdl_double_click_time 800
//
// Radial fog and its skybox (cheat-tagged; defaults -1 = auto): look outside and
// toward the 3D sky; the fog ring and the skybox fogging show themselves.
fog_radial 1
fog_radialskybox 1
//
// VProf and texture list commands run bare; watch for the vtrace file line and
// the texture panel behavior (the latter wants mat_texture_list 1 on for anything
// to show).
vprof_vtrace
mat_texture_list_txlod_sync

// PART 5 - the one not touched: sv_use_steam_networking stays at the value PART 2
// read back. The toggle decides the transport at server startup, so a mid-session
// set would at best queue a value. If you want the full answer, start a new listen
// server with it at 0 and see what changes - the description author does not
// require it.

// PART 6 lives elsewhere, deliberately: exec runs a .cfg top to bottom with no
// pauses, so the restore block would fire off instantly and kill every leave-on
// probe above before anything could be watched. The restores are their own file,
// exec'd by hand when you are done looking:
//   exec blankdesc-checks-restore-2026-10-17
// (data/blankdesc-checks-restore-2026-10-17.cfg - the values assume the catalog
// defaults; where PART 2's readback differs, reset to your own starting values -
// snd_ducking_off and tf_hide_custom_decals are archive cvars preserving your
// choices.)
