// tf2cfg catalog check - Linux client, 2026-10-17
// Run in the game console: exec linux-checks-2026-10-17 (log it first with
// con_logfile in-game-checks.txt, and con_logfile "" to stop afterwards).
// After it finishes: copy the console output back into data/ - the answers decide
// the tags these rows carry (see docs/ROADMAP.md section 7).

// PART 1 - cheat-tag candidates: the Linux client registers the flag for these
// three, the Windows client never did. Type each with sv_cheats 0, away from its
// default, and watch for a refusal. (Windows already answered with no refusal in
// the 2026-10-15 run.)
cl_particle_retire_cost 1
r_drawropes 0
tf_impactwatertimeenable 1

