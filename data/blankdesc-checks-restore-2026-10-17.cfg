// tf2cfg blank-description check - restore block, 2026-10-17
// Exec by hand after the probes in blankdesc-checks-2026-10-17.cfg have been
// watched: exec blankdesc-checks-restore-2026-10-17
// (Eyes on the visual/audio probes first - this file undoes everything, so it
// only goes in when the looking is done.)
// The values are the catalog defaults. Where PART 2's readback in the probe log
// differs from them, reset to your own starting values - snd_ducking_off and
// tf_hide_custom_decals are archive cvars and preserve your choices.
snd_ducking_off 1
tf_hide_custom_decals 1
cl_movehelper_process 1
cl_movehelper_process_imp 1
cl_movehelper_process_vel 1
cl_pred_doresetlatch 1
sv_viewmodel_lag_do_angles 1
sv_wallbug 0
sv_allow_server_adverisement_to_master_server 0
tf_voice_command_suspension_rate_limit_bucket_count 5
tf_voice_command_suspension_rate_limit_bucket_refill_rate 6
vgui_ui_scale_factor 1
vgui_ui_scale_factor_deck_additional 1
vgui_ui_scale_height 1080
vgui_ui_scale_width 1920
vphysics_nan_debug 0
sdl_double_click_size 2
sdl_double_click_time 400
fog_radial -1
fog_radialskybox -1
sv_cheats 0
