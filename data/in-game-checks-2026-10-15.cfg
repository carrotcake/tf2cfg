// tf2cfg in-game checks - docs/in-game-checklist.md section 4
//
// Copy this file into the game folder (tf/cfg/), then in the console:
//     sv_cheats 0
//     con_logfile checks.txt
//     exec in-game-checks-2026-10-15.cfg
//     con_logfile ""
// and send back checks.txt. Run it on a listen server (map itemtest) so the server
// cvars answer too. Nothing here is meant to stick: restart the map afterwards.

